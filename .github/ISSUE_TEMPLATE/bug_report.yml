name: Bug report
description: Report a reproducible problem with Atlas.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Atlas!

        Before submitting, please search existing issues to avoid duplicates.
        For installation help or general questions, please use Discussions.

  - type: dropdown
    id: game-flavor
    attributes:
      label: WoW game flavor
      description: Which version of World of Warcraft are you using?
      options:
        - Retail (Mainline)
        - Classic Era
        - Classic progression
        - Classic Anniverssary (TBC)
        - Forever
        - Other — specify in the game version field
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: WoW version and build
      description: Enter the game version and build, if available.
      placeholder: "Enter your WoW version and build"
    validations:
      required: true

  - type: input
    id: atlas-version
    attributes:
      label: Atlas version
      description: Enter the version of the Atlas core addon.
      placeholder: "Enter your Atlas version"
    validations:
      required: true

  - type: textarea
    id: modules
    attributes:
      label: Relevant map modules or plugins
      description: |
        List the relevant Atlas map modules or plugins and their versions.
        If none are involved, enter "None".
        If you are unsure, describe which (dungeon) map you are referring to, and/or which expansion the dungeon was from if you are aware.
      placeholder: |
        Module or plugin name:
        Version:
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Explain how to reproduce the problem.
      placeholder: |
        1. Log in to...
        2. Open Atlas...
        3. Select...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: lua-errors
    attributes:
      label: Lua errors
      description: Paste the full Lua error, if one appears.
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots and additional context
      description: |
        Add screenshots or any other information that may help.
        If you tested with unrelated addons disabled, include the result.